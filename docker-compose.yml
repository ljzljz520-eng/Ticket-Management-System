version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: scenic-mysql
    environment:
      MYSQL_ROOT_PASSWORD: scenic2024
      MYSQL_DATABASE: scenic_ticket
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scenic-redis
    command: redis-server --requirepass scenic2024
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenic-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scenic_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: scenic2024
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: scenic2024
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-scenic-ticket-system-jwt-secret-key-2024-very-long-and-secure}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: scenic-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
